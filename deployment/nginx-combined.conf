server {
    server_name invoices.bluehawana.com;

    # Backend API routes
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Static invoice files
    location /static/invoices/ {
        alias /home/harvad/invoice-processor/backend/invoices/;
        autoindex off;
    }

    # Frontend (Cloudflare Pages handles this)
    # This config is only needed if you want to serve backend from same domain
    # Otherwise, Cloudflare Pages serves the frontend directly
}
