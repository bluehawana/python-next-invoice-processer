server {
    listen 80;
    server_name api.bluehawana.com;

    # Backend API - proxy to FastAPI on port 8000
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Don't add CORS headers here - FastAPI handles them
    }

    # Static invoice files
    location /static/invoices/ {
        alias /home/harvad/invoice-processor/backend/invoices/;
        autoindex off;
        
        # CORS for static files only
        add_header 'Access-Control-Allow-Origin' 'https://invoices.bluehawana.com' always;
    }
}
