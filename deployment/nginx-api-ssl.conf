# HTTP - redirect to HTTPS
server {
    listen 80;
    server_name api.bluehawana.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name api.bluehawana.com;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/api.bluehawana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bluehawana.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Increase upload size limit for invoice images
    client_max_body_size 50M;

    # Backend API - proxy to FastAPI on port 8000
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for long-running operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        
        # IMPORTANT: Don't add CORS headers here - FastAPI handles them
        # This prevents duplicate CORS headers
    }

    # Static invoice files
    location /static/invoices/ {
        alias /home/harvad/invoice-processor/backend/invoices/;
        autoindex off;
        
        # CORS for static files only
        add_header 'Access-Control-Allow-Origin' 'https://invoices.bluehawana.com' always;
    }
}
